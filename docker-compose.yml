version: '3.8'

services:
  web:
    build: .
    container_name: fb-telegram-bridge-web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8000","--proxy-headers"]
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
